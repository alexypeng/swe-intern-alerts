# Simplify's listings file. The repo name changes each hiring cycle.
simplify_url = "https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json"

# Simplify postings are announced only for these companies (matched case-insensitively
# against Simplify's company_name). Seeded from Simplify's own FAANG+ list. Simplify is the
# slower fallback: companies also listed under [[boards]] are announced from the board first.
faang_plus = [
  "adobe", "airbnb", "amazon", "amd", "anthropic", "apple", "asana", "atlassian",
  "bytedance", "cloudflare", "coinbase", "crowdstrike", "databricks", "datadog",
  "doordash", "dropbox", "duolingo", "figma", "google", "ibm", "instacart", "intel",
  "linkedin", "lyft", "meta", "microsoft", "netflix", "notion", "nvidia", "openai",
  "oracle", "palantir", "paypal", "perplexity", "pinterest", "ramp", "reddit",
  "rippling", "robinhood", "roblox", "salesforce", "samsara", "servicenow", "shopify",
  "slack", "snap", "snapchat", "snowflake", "spacex", "splunk", "square", "stripe",
  "tesla", "tiktok", "tinder", "uber", "visa", "waymo", "x",
  # Added: companies not on Greenhouse/Ashby, covered only through Simplify for now.
  "citadel", "citadel securities", "two sigma", "optiver",
  "susquehanna international group", "susquehanna international group (sig)",
]

