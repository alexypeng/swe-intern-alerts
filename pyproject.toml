[project]
name = "intern-alerts"
version = "0.1.0"
description = "Polls internship job boards and announces new postings in Discord."
authors = [
    { name = "alexypeng", email = "81698776+alexypeng@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
